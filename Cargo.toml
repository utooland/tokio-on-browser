[package]
name = "tokio-on-browser"
version = "0.1.0"
authors = ["xusd320 <xusd320@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
console_error_panic_hook = { version = "0.1.7" }
futures = "0.3.31"
tokio = { version = "1.47.1", features = [
  "macros",
  "rt",
  "rt-multi-thread",
  "tracing",
] }
tokio-fs-ext = { version = "0.7.8", features = ["opfs_offload", "opfs_watch"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
tracing-web = "0.1.3"
js-sys = "=0.3.85"
wasm-bindgen = "=0.2.108"
wasm-bindgen-futures = "=0.4.58"
web-sys = { version = "=0.3.85", features = ["console"] }

[patch.crates-io]
tokio = { git = "https://github.com/utooland/tokio.git" }

[profile.wasm-dev]
inherits = "release"
opt-level = 1
debug = 1
strip = "none"
lto = false
panic = "unwind"
incremental = true
codegen-units = 256
